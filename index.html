<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEACON - AI Resume Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for rendering the final Markdown resume -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col font-sans">

    <!-- Navbar -->
    <header class="p-4 border-b border-gray-800 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-widest text-blue-400">BEACON ⛵</h1>
        <span class="text-sm text-gray-400" id="status-indicator">Awaiting Upload...</span>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- Left Panel: Upload & Document View -->
        <section class="w-1/2 border-r border-gray-800 p-8 flex flex-col bg-gray-800/50">
            <div id="upload-container" class="flex flex-col items-center justify-center h-full border-2 border-dashed border-gray-600 rounded-xl bg-gray-800 p-8 text-center transition hover:border-blue-500">
                <svg class="w-12 h-12 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                <h2 class="text-lg font-semibold mb-2">Upload Existing Resume</h2>
                <p class="text-sm text-gray-400 mb-6">PDF format up to 5MB</p>
                <input type="file" id="resume-upload" accept=".pdf" class="hidden">
                <button onclick="document.getElementById('resume-upload').click()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-lg font-medium transition">Select PDF</button>
            </div>

            <!-- This will show the final rendered resume -->
            <div id="final-resume-container" class="hidden h-full overflow-y-auto prose prose-invert max-w-none p-4"></div>
        </section>

        <!-- Right Panel: Agent Chat Interface -->
        <section class="w-1/2 flex flex-col bg-gray-900 relative">
            
            <!-- Chat History -->
            <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-4">
                <!-- Messages will be injected here -->
                <div class="text-gray-500 text-center mt-10 italic">Upload your resume to start the interview.</div>
            </div>

            <!-- Input Area -->
            <div class="p-4 bg-gray-800 border-t border-gray-700">
                <div class="flex gap-2">
                    <input type="text" id="user-input" disabled placeholder="Type your answer..." class="flex-1 bg-gray-900 border border-gray-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 disabled:opacity-50">
                    <button id="send-btn" disabled class="bg-white text-gray-900 px-6 py-3 rounded-lg font-semibold hover:bg-gray-200 transition disabled:opacity-50">Send</button>
                </div>
            </div>
            
            <!-- Loading Overlay -->
            <div id="loading-overlay" class="hidden absolute inset-0 bg-gray-900/80 flex items-center justify-center backdrop-blur-sm">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-white"></div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
